<style>
.hm{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
.hm h2{margin:0 0 14px;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.03em;font-weight:600;line-height:1}
.hm-rows{border-top:1.5px solid var(--ink)}
.hm-r{display:grid;grid-template-columns:34px minmax(0,1.5fr) minmax(0,1fr);gap:8px 10px;padding:14px 0;border-bottom:1px solid rgba(18,18,17,.15);align-items:center}
.hm-r .i{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.hm-r .w{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr auto;gap:8px 10px;align-items:center}
.hm-r .c{display:flex;gap:2px}
.hm-r .c button{font:inherit;width:30px;height:30px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.hm-r .c button:hover{color:var(--cob)}
.hm-add{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px}
.hm-map{position:sticky;top:24px}
.hm-n{border:1.5px solid var(--ink);padding:14px 16px;background:var(--paper);position:relative}
.hm-n b{display:block;font-size:20px;letter-spacing:-.02em;font-weight:600;line-height:1.1}
.hm-n .mono{display:block;margin-top:7px;color:var(--muted)}
.hm-n.sys{background:var(--cob);border-color:var(--cob);color:var(--cream)}.hm-n.sys .mono{color:rgba(242,240,235,.8)}
.hm-n.head{border-style:dashed}
.hm-n .hd{position:absolute;right:12px;top:10px;color:var(--cob);font-size:22px;transform:rotate(-4deg)}
.hm-k{height:46px;margin-left:26px;display:flex;align-items:center;padding-left:18px;border-left:3px solid var(--cob)}
.hm-k.look{border-left:2px dashed var(--ink)}
.hm-k.tape{border-left:3px dotted var(--cob)}
.hm-k span{font-size:11px}
.hm-k.tape span{font-family:'Caveat',cursive;font-weight:700;font-size:24px;color:var(--cob);transform:rotate(-3deg);text-transform:none;letter-spacing:0}
.hm-k.look span,.hm-k.auto span{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
@media (max-width:900px){.hm{grid-template-columns:1fr}.hm-map{position:static}.hm-r .w{grid-template-columns:1fr 1fr}.hm-r .c{grid-column:1/3;justify-content:flex-end}}
</style>
<main class="tw pad">
<div class="hm">
  <div>
    <h2>Your steps</h2>
    <div class="hm-rows" id="hmRows"></div>
    <div class="hm-add"><button type="button" class="tb" id="hmAdd">+ Add a step</button><button type="button" class="tb q" id="hmEx">Load the example</button><button type="button" class="tb q" id="hmClr">Clear</button></div>
  </div>
  <div class="hm-map"><h2>The map</h2><div id="hmMap"></div></div>
</div>
</main>
<section class="tres pad" id="hmRes">
  <div class="sc"><div class="num" id="hmNum"></div><div><h2 id="hmTtl"></h2><span class="as hand" id="hmAs"></span></div></div>
  <div class="fx" id="hmFx"></div>
  <div class="end"><button type="button" id="hmCopy">Copy the map as text</button><a href="/thinking/tape">Read: held together with tape</a><a href="/work-together">Want a second pair of eyes?</a></div>
</section>
<script>(function(){
var LIVES=['Someone’s head','An inbox','A group chat','A spreadsheet','A system'], HOW=['Someone tells them','They go and check','It notifies them'];
var EX=[{n:'Lead comes in',o:'Sam',l:1,h:0},{n:'Quote goes out',o:'Sam',l:3,h:0},{n:'Deal agreed',o:'Sam',l:0,h:0},{n:'Contract and invoice',o:'Dana',l:4,h:1},{n:'Order fulfilled',o:'Lee',l:2,h:0},{n:'Paid and closed',o:'Dana',l:4,h:2}];
var KEY='smirk_handoff_map', S;
try{ S=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
if(!S||!S.length) S=JSON.parse(JSON.stringify(EX));
var rows=document.getElementById('hmRows'), map=document.getElementById('hmMap');
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function opts(a,v){ return a.map(function(t,i){ return '<option value="'+i+'"'+(i===v?' selected':'')+'>'+esc(t)+'</option>'; }).join(''); }
function editor(){ rows.innerHTML=S.map(function(s,i){ var last=i===S.length-1;
  return '<div class="hm-r" data-i="'+i+'"><span class="i">'+(i<9?'0':'')+(i+1)+'</span><input data-k="n" value="'+esc(s.n)+'" placeholder="What happens" aria-label="Step '+(i+1)+'"><input data-k="o" value="'+esc(s.o)+'" placeholder="Who owns it" aria-label="Owner of step '+(i+1)+'">'+
  '<div class="w"><select data-k="l" aria-label="Where step '+(i+1)+' lives">'+opts(LIVES,s.l)+'</select>'+(last?'<span class="mono" style="color:var(--muted)">Last step</span>':'<select data-k="h" aria-label="How the next person finds out">'+opts(HOW,s.h)+'</select>')+
  '<span class="c"><button type="button" data-a="up" aria-label="Move up">↑</button><button type="button" data-a="dn" aria-label="Move down">↓</button><button type="button" data-a="rm" aria-label="Remove">×</button></span></div></div>'; }).join(''); }
function draw(){ var h='';
  S.forEach(function(s,i){ var cls=s.l===4?' sys':s.l===0?' head':'';
    h+='<div class="hm-n'+cls+'"><b>'+esc(s.n||'Untitled step')+'</b><span class="mono">'+esc(s.o||'Nobody')+' · '+esc(LIVES[s.l])+'</span>'+(s.l===0?'<span class="hd hand">only in their head.</span>':'')+'</div>';
    if(i<S.length-1) h+='<div class="hm-k '+['tape','look','auto'][s.h]+'"><span>'+['tape.','they have to look','it tells them'][s.h]+'</span></div>'; });
  map.innerHTML=h||'<p class="mono" style="color:var(--muted)">Add a step to start.</p>';
  var H=Math.max(S.length-1,0), tape=S.slice(0,-1).filter(function(s){return s.h===0;}).length, look=S.slice(0,-1).filter(function(s){return s.h===1;}).length;
  var by={}; S.forEach(function(s){ var k=(s.o||'').trim().toLowerCase(); if(k){ by[k]=by[k]||{n:s.o.trim(),c:0}; by[k].c++; } });
  var top=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.c-a.c;})[0];
  var places={}; S.forEach(function(s){ places[s.l]=1; }); var np=Object.keys(places).length, heads=S.filter(function(s){return s.l===0;});
  document.getElementById('hmNum').innerHTML=tape+'<small>/'+H+'</small>';
  document.getElementById('hmTtl').textContent=H===0?'Add a few steps.':tape===0?(look?'No tape. Some checking.':'No tape at all.'):tape===1?'One handoff is tape.':tape+' handoffs are tape.';
  document.getElementById('hmAs').textContent=H===0?'':tape===0?'nice.':tape/H>=.5?'it works. until someone’s out.':'that’s where things get dropped.';
  var F=[];
  var first=-1; S.slice(0,-1).some(function(s,i){ if(s.h===0){ first=i; return true; } });
  if(first>-1) F.push(['Start here','“'+(S[first].n||'Step '+(first+1))+'” → “'+(S[first+1].n||'Step '+(first+2))+'” only happens if '+(S[first].o||'someone')+' remembers to say so. Make that handoff announce itself.']);
  if(top&&S.length>=3&&top.c/S.length>=.5) F.push(['One person',top.n+' owns '+top.c+' of '+S.length+' steps. If '+top.n+' is out, most of this stops.']);
  if(heads.length) F.push(['In someone’s head',heads.map(function(s){return '“'+(s.n||'a step')+'”';}).join(', ')+' '+(heads.length>1?'exist':'exists')+' nowhere but memory. Write '+(heads.length>1?'them':'it')+' down before anything else.']);
  if(np>=4) F.push(['Too many places','This work lives in '+np+' different places. Every extra place is a detail typed again.']);
  if(look>=2) F.push(['Checking',look+' handoffs rely on someone going to look. Those are slow rather than broken, so fix them second.']);
  var fx=document.getElementById('hmFx'); fx.innerHTML=''; F.slice(0,4).forEach(function(f){ var d=document.createElement('div'); d.innerHTML='<span class="mono"></span><p></p><span></span>'; d.children[0].textContent=f[0]; d.children[1].textContent=f[1]; fx.appendChild(d); });
  fx.style.display=F.length?'':'none';
  window.__hmText='Handoff map\n'+S.map(function(s,i){ return (i+1)+'. '+(s.n||'Untitled')+' — '+(s.o||'nobody')+' ('+LIVES[s.l]+')'+(i<S.length-1?'\n   ↓ '+HOW[s.h]:''); }).join('\n')+'\n\n'+tape+' of '+H+' handoffs are tape.\n'+F.map(function(f){return '- '+f[0]+': '+f[1];}).join('\n')+'\n\nMade with https://smirk.io/tools/handoff-map';
}
rows.addEventListener('input',function(e){ var r=e.target.closest('.hm-r'); if(!r) return; var k=e.target.dataset.k; if(!k) return; var s=S[+r.dataset.i]; s[k]=(k==='l'||k==='h')?+e.target.value:e.target.value; save(); draw(); });
rows.addEventListener('click',function(e){ var b=e.target.closest('button[data-a]'); if(!b) return; var i=+b.closest('.hm-r').dataset.i, a=b.dataset.a;
  if(a==='rm') S.splice(i,1); else { var j=a==='up'?i-1:i+1; if(j<0||j>=S.length) return; var t=S[i]; S[i]=S[j]; S[j]=t; } save(); editor(); draw(); });
document.getElementById('hmAdd').addEventListener('click',function(){ S.push({n:'',o:'',l:1,h:0}); save(); editor(); draw(); var ins=rows.querySelectorAll('input[data-k="n"]'); ins[ins.length-1].focus(); });
document.getElementById('hmEx').addEventListener('click',function(){ S=JSON.parse(JSON.stringify(EX)); save(); editor(); draw(); });
document.getElementById('hmClr').addEventListener('click',function(){ S=[{n:'',o:'',l:1,h:0}]; save(); editor(); draw(); });
document.getElementById('hmCopy').addEventListener('click',function(){ var b=this; try{ navigator.clipboard.writeText(window.__hmText).then(function(){ b.textContent='Copied'; setTimeout(function(){b.textContent='Copy the map as text';},1600); }); }catch(e){} });
editor(); draw();
})();</script>

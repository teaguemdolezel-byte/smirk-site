<style>
.ct h2{margin:0 0 14px;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.03em;font-weight:600;line-height:1}
.ct-rows{border-top:1.5px solid var(--ink)}
.ct-h,.ct-r{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(3,minmax(0,1fr)) minmax(0,1.6fr) 30px;gap:10px;align-items:center}
.ct-h{padding:12px 0 0;color:var(--muted)}
.ct-r{padding:12px 0;border-bottom:1px solid rgba(18,18,17,.15)}
.ct-r .bar{height:38px;position:relative;background:rgba(18,18,17,.04)}
.ct-r .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cob);transition:width .4s cubic-bezier(.16,1,.3,1)}
.ct-r .bar span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);mix-blend-mode:normal}
.ct-r button{font:inherit;border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px}.ct-r button:hover{color:var(--cob)}
.ct-g{display:flex;gap:26px 40px;flex-wrap:wrap;align-items:flex-end;margin-top:20px}
.ct-g label{display:block;max-width:190px}.ct-g label .mono{display:block;color:var(--muted);margin-bottom:7px}
.ct-pay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(34px,4vw,56px);border-top:1.5px solid var(--cream);padding-top:26px}
.ct-pay .mono{display:block;opacity:.8;margin-bottom:10px}
.ct-pay b{display:block;font-weight:500;font-size:clamp(30px,3.6vw,56px);letter-spacing:-.04em;line-height:1}
.ct-pay input[type=range]{width:100%;accent-color:#CDD5FF;margin-top:14px;padding:0;border:0;background:none}
.ct-pay input[type=number]{font:inherit;font-size:18px;width:100%;max-width:190px;padding:10px 12px;border-radius:0;background:rgba(242,240,235,.1);border:1.5px solid rgba(242,240,235,.5);color:var(--cream)}
.ct-pay input[type=number]:focus{outline:2px solid #CDD5FF;outline-offset:1px}
.ct-pay p{margin:10px 0 0;font-size:15px;line-height:1.45;color:rgba(242,240,235,.85)}
@media (max-width:820px){.ct-h{display:none}.ct-r{grid-template-columns:1fr 1fr 1fr 30px}.ct-r input[data-k="n"]{grid-column:1/5}.ct-r .bar{grid-column:1/5;order:9}.ct-pay{grid-template-columns:1fr}}
</style>
<main class="tw pad ct">
  <h2>The manual jobs</h2>
  <div class="ct-h mono"><span>What gets done by hand</span><span>Times a week</span><span>Minutes each</span><span>People</span><span>Cost a year</span><span></span></div>
  <div class="ct-rows" id="ctRows"></div>
  <div class="ct-g">
    <button type="button" class="tb" id="ctAdd">+ Add a job</button>
    <label><span class="mono">Cost of an hour ($)</span><input type="number" id="ctRate" min="1" step="1" inputmode="decimal"></label>
    <label><span class="mono">Working weeks a year</span><input type="number" id="ctWeeks" min="1" max="52" step="1" inputmode="numeric"></label>
    <button type="button" class="tb q" id="ctEx">Load the example</button>
  </div>
</main>
<section class="tres pad">
  <div class="sc"><div class="num" id="ctNum"></div><div><h2 id="ctTtl"></h2><span class="as hand" id="ctAs"></span></div></div>
  <p class="tx" id="ctTx"></p>
  <div class="ct-pay">
    <div><span class="mono">If a system removed</span><b id="ctPctV"></b><input type="range" id="ctPct" min="10" max="100" step="5" aria-label="Share of the work removed"><p>of this work. Few fixes remove all of it; 60 to 80% is realistic.</p></div>
    <div><span class="mono">You’d get back</span><b id="ctSave"></b><p id="ctSaveH"></p></div>
    <div><span class="mono">A fix that costs ($)</span><input type="number" id="ctBuild" min="0" step="500" inputmode="numeric" aria-label="Cost of the fix"><b id="ctBack" style="margin-top:14px"></b><p>to pay for itself.</p></div>
  </div>
  <div class="end"><button type="button" id="ctCopy">Copy the numbers</button><a href="/tools/handoff-map">Map where it happens</a><a href="/work-together">Want a second pair of eyes?</a></div>
</section>
<script>(function(){
var EX={rate:35,weeks:48,pct:70,build:15000,t:[{n:'Retyping order details into a second tool',p:25,m:6,k:1},{n:'Chasing status by message',p:40,m:4,k:2},{n:'Building the weekly report',p:1,m:90,k:1},{n:'Writing the same follow-up email',p:15,m:8,k:1}]};
var KEY='smirk_cost_of_tape', S; try{ S=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){} if(!S||!S.t) S=JSON.parse(JSON.stringify(EX));
var rows=document.getElementById('ctRows'), $=function(i){return document.getElementById(i);};
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function num(v){ v=parseFloat(v); return isFinite(v)&&v>0?v:0; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function editor(){ rows.innerHTML=S.t.map(function(t,i){ return '<div class="ct-r" data-i="'+i+'"><input data-k="n" value="'+esc(t.n)+'" placeholder="A job done by hand" aria-label="Job '+(i+1)+'"><input data-k="p" type="number" min="0" step="1" inputmode="decimal" value="'+t.p+'" aria-label="Times a week"><input data-k="m" type="number" min="0" step="1" inputmode="decimal" value="'+t.m+'" aria-label="Minutes each"><input data-k="k" type="number" min="1" step="1" inputmode="numeric" value="'+t.k+'" aria-label="People involved"><div class="bar"><i></i><span></span></div><button type="button" aria-label="Remove">×</button></div>'; }).join('');
  $('ctRate').value=S.rate; $('ctWeeks').value=S.weeks; $('ctPct').value=S.pct; $('ctBuild').value=S.build; }
function calc(){ var hrs=S.t.map(function(t){ return num(t.p)*num(t.m)/60*Math.max(num(t.k),1)*num(S.weeks); }), tot=hrs.reduce(function(a,b){return a+b;},0), cost=tot*num(S.rate), mx=Math.max.apply(null,hrs.concat([1]));
  [].forEach.call(rows.children,function(r,i){ r.querySelector('.bar i').style.width=(hrs[i]/mx*100)+'%'; r.querySelector('.bar span').textContent=money(hrs[i]*num(S.rate)); });
  $('ctNum').innerHTML=Math.round(tot).toLocaleString('en-US')+'<small>hrs</small>';
  $('ctTtl').textContent=money(cost)+' a year.';
  var wk=tot/40; $('ctAs').textContent=tot<1?'':wk>=1?'about '+(wk>=10?Math.round(wk):wk.toFixed(1))+' working weeks. gone.':'not much. yet.';
  var bi=hrs.indexOf(Math.max.apply(null,hrs)), big=S.t[bi];
  $('ctTx').textContent=tot<1?'Add a job and the numbers appear.':'That’s '+Math.round(tot).toLocaleString('en-US')+' hours of work a year that produces nothing new. The biggest strip is “'+(big.n||'job '+(bi+1))+'”, at '+Math.round(hrs[bi]/tot*100)+'% of the total. Start there.';
  var sv=cost*num(S.pct)/100; $('ctPctV').textContent=S.pct+'%'; $('ctSave').textContent=money(sv)+' a year'; $('ctSaveH').textContent=Math.round(tot*num(S.pct)/100).toLocaleString('en-US')+' hours back, every year it runs.';
  var mo=sv>0?num(S.build)/(sv/12):0; $('ctBack').textContent=sv<=0?'—':num(S.build)===0?'Day one':mo<1?'Under a month':mo>120?'10+ years':mo<24?(Math.round(mo*10)/10)+' months':(Math.round(mo/12*10)/10)+' years';
  window.__ctText='The cost of tape\n'+S.t.map(function(t,i){ return '- '+(t.n||'Job '+(i+1))+': '+Math.round(hrs[i])+' hrs, '+money(hrs[i]*num(S.rate))+' a year'; }).join('\n')+'\nTotal: '+Math.round(tot)+' hours, '+money(cost)+' a year.\nRemoving '+S.pct+'% gets back '+money(sv)+' a year; a '+money(num(S.build))+' fix pays for itself in '+$('ctBack').textContent.toLowerCase()+'.\n\nMade with https://smirk.io/tools/cost-of-tape'; }
rows.addEventListener('input',function(e){ var r=e.target.closest('.ct-r'), k=e.target.dataset.k; if(!r||!k) return; S.t[+r.dataset.i][k]=k==='n'?e.target.value:num(e.target.value); save(); calc(); });
rows.addEventListener('click',function(e){ if(e.target.tagName!=='BUTTON') return; S.t.splice(+e.target.closest('.ct-r').dataset.i,1); save(); editor(); calc(); });
[['ctRate','rate'],['ctWeeks','weeks'],['ctPct','pct'],['ctBuild','build']].forEach(function(p){ $(p[0]).addEventListener('input',function(){ S[p[1]]=num(this.value); save(); calc(); }); });
$('ctAdd').addEventListener('click',function(){ S.t.push({n:'',p:5,m:10,k:1}); save(); editor(); calc(); var ins=rows.querySelectorAll('input[data-k="n"]'); ins[ins.length-1].focus(); });
$('ctEx').addEventListener('click',function(){ S=JSON.parse(JSON.stringify(EX)); save(); editor(); calc(); });
$('ctCopy').addEventListener('click',function(){ var b=this; try{ navigator.clipboard.writeText(window.__ctText).then(function(){ b.textContent='Copied'; setTimeout(function(){b.textContent='Copy the numbers';},1600); }); }catch(e){} });
editor(); calc();
})();</script>
